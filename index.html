<!doctype html>
<html lang="vi" data-pa="A">
<head>
<title>Cơ Điện · 机电</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cơ Điện · 机电">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e5a6e">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
/* Cơ Điện · 机电 — giao diện.
 * Bố cục: app một cột cho iPhone — thanh đầu màu thương hiệu, nội dung là các nhóm dòng kiểu phiếu kỹ thuật,
 * thanh dưới 5 ô. Mọi chữ hai tầng: tiếng Việt dòng chính, tiếng Trung dòng phụ nhỏ hơn.
 * Màu là token; phương án logo (data-pa A/B/C) chỉ đổi nhóm token thương hiệu.
 */
:root {
  --nen: #eef1f3;          /* nền thép sáng */
  --mat: #ffffff;          /* mặt thẻ */
  --mat-2: #f6f8f9;        /* mặt phụ, ô nhập */
  --chu: #14202a;
  --phu: #5b6874;
  --mo: #8894a0;
  --vien: #d9dfe4;
  --vien-dam: #c3cbd2;
  --chinh: #0e6178;        /* thương hiệu: nút, ô đang chọn */
  --chinh-chu: #ffffff;
  --chinh-nhat: #e0eef2;
  --nhan: #f2a516;         /* điểm nhấn: huy hiệu, chấm */
  --dau-nen: #0e5a6e;      /* thanh đầu */
  --dau-chu: #ffffff;
  --tot: #1d7a46;  --tot-nhat: #e2f3e9;
  --canh: #9a5a00; --canh-nhat: #fff0d4;
  --loi: #c0362c;  --loi-nhat: #fbe5e3;
  --phu-bong: rgba(12, 22, 30, .45);
  --bong: 0 1px 2px rgba(16, 26, 36, .07), 0 0 0 1px rgba(16, 26, 36, .04);
  --bong-noi: 0 10px 30px rgba(10, 20, 30, .18);
  --f: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
  --f-so: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --bo: 14px;
  --dau-cao: 56px;
  --duoi-cao: 62px;
  color-scheme: light;
}
:root[data-pa="B"] { --chinh: #b8531a; --chinh-nhat: #f7e7dc; --nhan: #e27a32; --dau-nen: #242c34; }
:root[data-pa="C"] { --chinh: #167a4a; --chinh-nhat: #dff0e7; --nhan: #f0bd1c; --dau-nen: #146c43; }

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --nen: #0d1317; --mat: #161e24; --mat-2: #1c252c; --chu: #e4eaee; --phu: #9aa7b2; --mo: #6f7c87;
    --vien: #29333c; --vien-dam: #37434d;
    --chinh: #3fa6c0; --chinh-chu: #04212a; --chinh-nhat: #12303a; --nhan: #f5b93a; --dau-nen: #0b3a47; --dau-chu: #eef6f8;
    --tot: #5cc68e; --tot-nhat: #133323; --canh: #f0b54a; --canh-nhat: #3a2a0c; --loi: #f07a70; --loi-nhat: #3d1715;
    --phu-bong: rgba(0, 0, 0, .6);
    --bong: 0 0 0 1px rgba(255, 255, 255, .05);
    color-scheme: dark;
  }
  :root:not([data-theme="light"])[data-pa="B"] { --chinh: #ee8b4b; --chinh-chu: #2a1203; --chinh-nhat: #3a2617; --nhan: #ee8b4b; --dau-nen: #1a2027; }
  :root:not([data-theme="light"])[data-pa="C"] { --chinh: #4cb880; --chinh-chu: #03210f; --chinh-nhat: #133423; --nhan: #f3c53d; --dau-nen: #0f4a2f; }
}
:root[data-theme="dark"] {
  --nen: #0d1317; --mat: #161e24; --mat-2: #1c252c; --chu: #e4eaee; --phu: #9aa7b2; --mo: #6f7c87;
  --vien: #29333c; --vien-dam: #37434d;
  --chinh: #3fa6c0; --chinh-chu: #04212a; --chinh-nhat: #12303a; --nhan: #f5b93a; --dau-nen: #0b3a47; --dau-chu: #eef6f8;
  --tot: #5cc68e; --tot-nhat: #133323; --canh: #f0b54a; --canh-nhat: #3a2a0c; --loi: #f07a70; --loi-nhat: #3d1715;
  --phu-bong: rgba(0, 0, 0, .6);
  --bong: 0 0 0 1px rgba(255, 255, 255, .05);
  color-scheme: dark;
}
:root[data-theme="dark"][data-pa="B"] { --chinh: #ee8b4b; --chinh-chu: #2a1203; --chinh-nhat: #3a2617; --nhan: #ee8b4b; --dau-nen: #1a2027; }
:root[data-theme="dark"][data-pa="C"] { --chinh: #4cb880; --chinh-chu: #03210f; --chinh-nhat: #133423; --nhan: #f3c53d; --dau-nen: #0f4a2f; }

/* ---------- Nền tảng ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; background: var(--nen); color: var(--chu);
  font: 16px/1.4 var(--f); -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  overscroll-behavior-y: none;
}
button, input, select, textarea { font: inherit; color: inherit; touch-action: manipulation; }
button { cursor: pointer; }
a { color: var(--chinh); text-decoration: none; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--chinh); outline-offset: 2px; }
.so, .tab-so { font-variant-numeric: tabular-nums; }
.ic { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ic-nho { width: 18px; height: 18px; }

/* Song ngữ: tiếng Trung dòng phụ; trong nút, chip, tab thì cùng dòng "Lưu · 保存". */
.zh { display: block; font-size: .8em; font-weight: 400; opacity: .78; line-height: 1.3; }
.nut .zh, .chip .zh, .nhan-ngang .zh, .inline .zh { display: inline; font-size: .86em; }
.nut .zh::before, .chip .zh::before, .nhan-ngang .zh::before, .inline .zh::before { content: "· "; }
.zh.thieu { color: var(--canh); opacity: 1; }
.gon .zh { display: inline; font-size: .95em; }

/* ---------- Khởi động ---------- */
.khoi-dong { min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 14px; background: var(--dau-nen); color: var(--dau-chu); text-align: center; font-weight: 600; font-size: 20px; }
.khoi-dong-logo { width: 84px; height: 84px; border-radius: 20px; overflow: hidden; box-shadow: 0 8px 24px rgba(0, 0, 0, .25); }
.khoi-dong-logo svg { width: 100%; height: 100%; display: block; }

/* ---------- Khung app ---------- */
.dau {
  position: fixed; inset: 0 0 auto 0; z-index: 20;
  padding: env(safe-area-inset-top, 0px) max(8px, env(safe-area-inset-right, 0px)) 0 max(8px, env(safe-area-inset-left, 0px));
  background: var(--dau-nen); color: var(--dau-chu);
}
.dau-trong { height: var(--dau-cao); display: grid; grid-template-columns: 52px 1fr auto; align-items: center; gap: 4px; }
.dau-giua { min-width: 0; text-align: center; }
.dau-vi { font-size: 17px; font-weight: 650; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dau-zh { font-size: 12px; opacity: .8; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dau-phai { display: flex; align-items: center; justify-content: flex-end; gap: 2px; min-width: 52px; }
.nut-dau { width: 44px; height: 44px; display: grid; place-items: center; border: 0; background: none; color: inherit; border-radius: 12px; position: relative; }
.nut-dau:active { background: rgba(255, 255, 255, .14); }
.logo-nho { display: block; width: 34px; height: 34px; border-radius: 9px; overflow: hidden; margin-left: 5px; box-shadow: 0 0 0 1px rgba(255, 255, 255, .2); }
.logo-nho svg { width: 100%; height: 100%; display: block; }
.chip-cho {
  height: 30px; display: inline-flex; align-items: center; gap: 4px; padding: 0 9px 0 7px; border: 0; border-radius: 15px;
  background: var(--nhan); color: #1c1400; font-weight: 700; font-size: 14px;
}
.chip-cho .ic { width: 16px; height: 16px; stroke-width: 2.4; }
.chip-cho.loi { background: #ff6b5e; color: #2a0300; }
.xoay .ic, .ic.xoay { animation: xoay 1s linear infinite; }
@keyframes xoay { to { transform: rotate(360deg); } }

.bang-tin { position: fixed; left: 0; right: 0; z-index: 19; top: calc(env(safe-area-inset-top, 0px) + var(--dau-cao)); display: grid; }
.bang-tin > div { padding: 8px 16px; font-size: 14px; display: flex; align-items: center; gap: 8px; }
.tin-mang { background: #3b4650; color: #fff; }
.tin-ban-moi { background: var(--nhan); color: #1c1400; font-weight: 600; }
.tin-ban-moi button { margin-left: auto; border: 0; background: rgba(0, 0, 0, .82); color: #fff; border-radius: 9px; padding: 7px 12px; font-weight: 600; font-size: 14px; }
.tin-mang .inline, .tin-ban-moi .inline { min-width: 0; }

main.noi-dung {
  padding: calc(env(safe-area-inset-top, 0px) + var(--dau-cao) + 12px + var(--bu-tin, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 28px) max(16px, env(safe-area-inset-left, 0px));
  max-width: 720px; margin: 0 auto; display: grid; gap: 16px; align-content: start;
}
body.co-thanh-duoi main.noi-dung { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + var(--duoi-cao) + 24px); }

.thanh-duoi {
  position: fixed; inset: auto 0 0 0; z-index: 20; background: var(--mat); border-top: 1px solid var(--vien);
  padding: 0 env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
}
.tab { height: var(--duoi-cao); display: grid; place-items: center; align-content: center; gap: 1px; color: var(--mo); font-size: 11px; line-height: 1.15; text-align: center; }
.tab .zh { font-size: 10px; }
.tab.dang { color: var(--chinh); font-weight: 600; }
.tab-giua .tab-tron { width: 48px; height: 48px; margin-top: -14px; border-radius: 16px; display: grid; place-items: center; background: var(--chinh); color: var(--chinh-chu); box-shadow: 0 4px 14px rgba(0, 0, 0, .2); }

/* ---------- Khối nội dung ---------- */
.muc { display: grid; gap: 8px; }
.muc-tieu-de { margin: 0 4px; font-size: 13px; font-weight: 650; text-transform: uppercase; letter-spacing: .04em; color: var(--phu); display: flex; align-items: baseline; gap: 8px; }
.muc-tieu-de .zh { display: inline; text-transform: none; letter-spacing: 0; font-size: 12px; }
.muc-ghi { margin: 0 4px; font-size: 13px; color: var(--phu); }
.nhom { background: var(--mat); border-radius: var(--bo); box-shadow: var(--bong); overflow: hidden; }
.dong {
  display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 10px 14px; width: 100%;
  background: none; border: 0; text-align: left; color: inherit;
}
.dong + .dong, .dong + .dong-mo, .dong-mo + .dong { border-top: 1px solid var(--vien); }
button.dong:active, a.dong:active { background: var(--mat-2); }
.dong-chu { flex: 1; min-width: 0; }
.dong-chinh { font-weight: 550; overflow-wrap: anywhere; }
.dong-phu { font-size: 13px; color: var(--phu); margin-top: 2px; overflow-wrap: anywhere; }
.dong-phai { flex: none; display: flex; align-items: center; gap: 6px; color: var(--mo); font-size: 14px; text-align: right; }
.dong .ic-dau { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--chinh-nhat); color: var(--chinh); flex: none; }
.dong.mo, .dong-mo { opacity: .55; }
.dong.nguy { color: var(--loi); }
.dong.nguy .ic-dau { background: var(--loi-nhat); color: var(--loi); }

.the { background: var(--mat); border-radius: var(--bo); box-shadow: var(--bong); padding: 16px; display: grid; gap: 10px; }
.trong { text-align: center; color: var(--phu); padding: 28px 16px; display: grid; gap: 6px; justify-items: center; }
.trong .ic { width: 32px; height: 32px; color: var(--mo); }

/* Huy hiệu trạng thái */
.hh { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; line-height: 1.5; white-space: nowrap; background: var(--mat-2); color: var(--phu); box-shadow: inset 0 0 0 1px var(--vien); }
.hh .zh { display: inline; font-size: 11px; }
.hh .zh::before { content: "· "; }
.hh-tot { background: var(--tot-nhat); color: var(--tot); box-shadow: none; }
.hh-canh { background: var(--canh-nhat); color: var(--canh); box-shadow: none; }
.hh-loi { background: var(--loi-nhat); color: var(--loi); box-shadow: none; }
.hh-chinh { background: var(--chinh-nhat); color: var(--chinh); box-shadow: none; }
.cac-hh { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }

.anh-dai-dien { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 16px; flex: none; color: #fff; }
.cap-1 { background: #7a3db8; } .cap-2 { background: #1f6fb2; } .cap-3 { background: #2f8a55; } .cap-4 { background: #8a6a1f; }

/* ---------- Nút ---------- */
.nut {
  min-height: 48px; padding: 10px 16px; border-radius: 12px; border: 0; font-weight: 650; font-size: 16px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center; line-height: 1.25;
  background: var(--chinh); color: var(--chinh-chu);
}
.nut:active { filter: brightness(.92); }
.nut:disabled { opacity: .5; }
.nut.phu { background: var(--mat); color: var(--chu); box-shadow: inset 0 0 0 1px var(--vien-dam); }
.nut.nhat { background: var(--chinh-nhat); color: var(--chinh); }
.nut.nguy { background: var(--loi-nhat); color: var(--loi); }
.nut.rong { width: 100%; }
.nut.nho { min-height: 36px; padding: 6px 12px; font-size: 14px; border-radius: 10px; }
.hang-nut { display: flex; flex-wrap: wrap; gap: 8px; }
.hang-nut > .nut { flex: 1 1 140px; }
.hang-nut.doc > .nut { flex-basis: 100%; }
/* Nút hai tầng: tiếng Trung xuống dòng dưới (nút đứng cạnh nhau, nhãn dài) */
.nut.tang { flex-direction: column; gap: 1px; padding: 8px 10px; line-height: 1.2; }
.nut.tang .zh { display: block; font-size: .8em; }
.nut.tang .zh::before { content: none; }
.nut.tang > .ic { margin-bottom: 3px; }
.hang-nut.ba > .nut { flex: 1 1 0; min-width: 0; }

.chip { height: 36px; padding: 0 14px; border-radius: 18px; border: 0; background: var(--mat); color: var(--chu); box-shadow: inset 0 0 0 1px var(--vien-dam); font-size: 14px; font-weight: 550; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.chip.dang { background: var(--chinh); color: var(--chinh-chu); box-shadow: none; }
.chip .dem { font-size: 12px; opacity: .8; }
.dai-chip { display: flex; gap: 8px; overflow-x: auto; padding: 2px 16px 4px; margin: 0 -16px; scrollbar-width: none; }
.dai-chip::-webkit-scrollbar { display: none; }

/* ---------- Ô nhập ---------- */
.o { display: grid; gap: 6px; }
.o > label, .o-nhan { font-size: 14px; font-weight: 600; color: var(--phu); }
.o > label .zh, .o-nhan .zh { display: inline; font-weight: 400; }
.o > label .zh::before, .o-nhan .zh::before { content: "· "; }
.o-nhap {
  width: 100%; min-height: 48px; padding: 11px 13px; border-radius: 12px; border: 1px solid var(--vien-dam);
  background: var(--mat); font-size: 17px; appearance: none; -webkit-appearance: none;
}
select.o-nhap { background-image: linear-gradient(45deg, transparent 50%, var(--phu) 50%), linear-gradient(135deg, var(--phu) 50%, transparent 50%); background-position: calc(100% - 20px) 50%, calc(100% - 14px) 50%; background-size: 6px 6px; background-repeat: no-repeat; padding-right: 36px; }
.o-nhap:focus { outline: none; border-color: var(--chinh); box-shadow: 0 0 0 3px var(--chinh-nhat); }
.o-nhap[readonly] { background: var(--mat-2); color: var(--phu); }
.o-goi-y { font-size: 13px; color: var(--mo); }
.o-loi { font-size: 13px; color: var(--loi); }
.o-tim { position: relative; }
.o-tim .ic { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--mo); }
.o-tim .o-nhap { padding-left: 40px; }

.bat { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; }
.bat input { appearance: none; -webkit-appearance: none; width: 52px; height: 32px; border-radius: 16px; background: var(--vien-dam); position: relative; flex: none; transition: background .15s; margin: 0; }
.bat input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); transition: transform .15s; }
.bat input:checked { background: var(--chinh); }
.bat input:checked::after { transform: translateX(20px); }

.chon-the { display: grid; gap: 8px; }
.chon-the label { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--vien-dam); background: var(--mat); }
.chon-the input { margin: 3px 0 0; width: 20px; height: 20px; accent-color: var(--chinh); flex: none; }
.chon-the label:has(input:checked) { border-color: var(--chinh); background: var(--chinh-nhat); }
.chon-the .dong-phu { margin-top: 3px; }

/* ---------- Đăng nhập / bàn phím PIN ---------- */
.man-pin {
  min-height: 100vh; min-height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; justify-items: center;
  padding: calc(env(safe-area-inset-top, 0px) + 28px) 16px calc(env(safe-area-inset-bottom, 0px) + 16px);
  background: var(--dau-nen); color: var(--dau-chu);   /* màn khoá màu thương hiệu: chữ thanh trạng thái iPhone (trắng) luôn đọc được */
}
.man-pin .the { color: var(--chu); }
.man-pin .pin-cty, .man-pin .pin-chan { color: rgba(255, 255, 255, .72); }
.man-pin .pin-cham i { border-color: rgba(255, 255, 255, .55); }
.man-pin .pin-cham i.co { background: #fff; border-color: #fff; }
.man-pin .pin-bao { color: #ffc4bd; }
.man-pin .pin-bao.dang { color: rgba(255, 255, 255, .8); }
.man-pin .phim { background: rgba(255, 255, 255, .13); color: #fff; box-shadow: none; }
.man-pin .phim:active { background: rgba(255, 255, 255, .3); }
.man-pin .phim.phu { background: none; color: rgba(255, 255, 255, .85); }
.pin-dau { display: grid; justify-items: center; gap: 10px; text-align: center; }
.pin-logo { width: 72px; height: 72px; border-radius: 18px; overflow: hidden; box-shadow: 0 6px 18px rgba(0, 0, 0, .18); }
.pin-logo svg { width: 100%; height: 100%; display: block; }
.pin-ten { font-size: 22px; font-weight: 700; line-height: 1.2; }
.pin-ten .zh { font-size: 15px; }
.pin-cty { font-size: 14px; color: var(--phu); }
.pin-giua { display: grid; justify-items: center; align-content: center; gap: 14px; width: 100%; max-width: 340px; padding: 16px 0; }
.pin-hoi { font-size: 17px; font-weight: 600; text-align: center; }
.pin-cham { display: flex; gap: 16px; height: 22px; align-items: center; }
.pin-cham i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--vien-dam); transition: background .1s, border-color .1s; }
.pin-cham i.co { background: var(--chinh); border-color: var(--chinh); }
.pin-cham.rung { animation: rung .35s; }
@keyframes rung { 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }
.pin-bao { min-height: 40px; font-size: 14px; text-align: center; color: var(--loi); }
.pin-bao.dang { color: var(--phu); }
.ban-phim { display: grid; grid-template-columns: repeat(3, 76px); gap: 14px 26px; justify-content: center; }
.phim { height: 76px; border-radius: 50%; border: 0; background: var(--mat); box-shadow: var(--bong); font-size: 30px; font-weight: 450; color: var(--chu); display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.phim:active { background: var(--chinh-nhat); }
.phim.phu { background: none; box-shadow: none; font-size: 14px; font-weight: 600; color: var(--phu); }
.phim.phu .ic { width: 28px; height: 28px; }
.phim:disabled { opacity: .4; }
.pin-chan { display: grid; justify-items: center; gap: 6px; font-size: 13px; color: var(--mo); text-align: center; }

/**

    return goiMayChu(req, tc.lau ? HET_GIO_BAO_CAO : HET_GIO_GOI).then(function (r) {
      if (!r || typeof r !== 'object') throw new LoiApi('MAY_CHU_SAI');
      datMang(true);

/**

  return p.then(function () { veDangNhap(thongBaoKhoa ? t(thongBaoKhoa) : ''); });
}

/* ---------- 5. Hàng chờ gửi ---------- */
var SAU_GUI = {};   // action → hàm(data, việc) chạy khi gửi xong (cập nhật dữ liệu trên máy)
var NHAN_VIEC = {}; // action → khoá chữ mô tả việc trong Hàng chờ, hoặc hàm(việc) trả HTML
var TRUOC_GUI = {}; // action → hàm(việc) trả Promise<payload gửi đi> (ví dụ ảnh: lấy dữ liệu ảnh trên máy lúc gửi)
var SAU_BO = {};    // action → hàm(việc) khi người dùng bỏ việc (dọn dữ liệu kèm theo)
var VIEC_LAU = {};  // action → 1: chờ máy chủ tới 90 giây (gửi ảnh)
var KHOI_DONG = []; // hàm trả Promise, chạy lúc mở app cùng lúc tải dữ liệu trên máy
function nhanViec(it) {
  var n = NHAN_VIEC[it.action];
  if (typeof n === 'function') { try { return n(it); } catch (e) { return esc(it.action); } }
  return n ? t(n) : esc(it.action);
}

/**
 * Ghi việc vào hàng chờ rồi gửi ở nền. meta: { dong: [{bang, ...dòng}] hiện tạm trên máy }.
 * Việc hiện ngay với nhãn "Chờ gửi · 待发送"; có mạng thì gửi lần lượt.
 */
function send(action, payload, meta) {
  meta = meta || {};
  var it = {
    opId: taoOpId(), action: action, payload: payload || {}, uid: S.uid, luc: Date.now(),
    seq: ++S.seq, trangThai: 'cho', soLan: 0, loi: null, dong: meta.dong || null
  };
  S.hang.push(it);
  kvDat('seq', S.seq);
  return DB.dat('hang', it).then(function () {
    apDungTam(it);
    veChipCho();
    setTimeout(guiHangCho, 0);
    return it;
  });
}
function soViecCho() { return S.hang.filter(function (x) { return x.trangThai !== 'loi'; }).length; }
function soViecLoi() { return S.hang.filter(function (x) { return x.trangThai === 'loi'; }).length; }

/** Dòng tạm của việc chưa gửi: hiện trên máy với cờ _cho. */
function apDungTam(it) {
  (it.dong || []).forEach(function (d) {
    if (!d.bang || !D[d.bang]) return;
    var x = Object.assign({}, D[d.bang].get(d.ID) || {}, d, { _cho: it.opId });
    delete x.bang;
    D[d.bang].set(x.ID, x);
  });
}

function moLaiHangChoCua(uid) {
  var doi = false;
  S.hang.forEach(function (x) { if (x.uid === uid && x.trangThai === 'choDN' && tokenCua(uid)) { x.trangThai = 'cho'; doi = true; DB.dat('hang', x); } });
  if (doi) setTimeout(guiHangCho, 0);
}

/** Gửi lần lượt. Mất mạng hoặc máy chủ bận: dừng, thử lại sau. Bị từ chối: đánh dấu lỗi, việc sau vẫn gửi. */
function guiHangCho() {
  if (!S.hang.length) return Promise.resolve();
  if (S.dangGui) { S.goiLaiSau = true; return Promise.resolve(); } // đang gửi: gửi thêm lượt nữa khi xong
  S.dangGui = true;
  S.goiLaiSau = false;
  var coGui = false;
  var ds = S.hang.slice().sort(function (a, b) { return a.seq - b.seq; });
  var i = 0;
  function luu(it) { return DB.dat('hang', it).catch(function () {}); }
  function tiep() {
    if (i >= ds.length) return Promise.resolve();
    var it = ds[i++];
    if (S.hang.indexOf(it) < 0 || it.trangThai === 'loi') return tiep();
    if (!tokenCua(it.uid)) {
      if (it.trangThai !== 'choDN') { it.trangThai = 'choDN'; luu(it); }
      return tiep();
    }
    it.trangThai = 'dang';
    veChipCho();
    var chuanBi = TRUOC_GUI[it.action] ? Promise.resolve(it).then(TRUOC_GUI[it.action]) : Promise.resolve(it.payload);
    return chuanBi.then(function (payload) {
      return api(it.action, payload, { uid: it.uid, opId: it.opId, khongThuLai: true, lau: !!VIEC_LAU[it.action] });
    }).then(function (data) {
      S.hang.splice(S.hang.indexOf(it), 1);
      coGui = true;
      return DB.xoa('hang', it.opId).then(function () {
        if (SAU_GUI[it.action]) try { SAU_GUI[it.action](data, it); } catch (e) { console.error(e); }
        return tiep();
      });
    }, function (e) {
      if (e.mang || e.code === 'BAN') { it.trangThai = 'cho'; return luu(it); } // dừng, thử lại sau
      if (e.code === 'HET_PHIEN' || e.code === 'TK_KHOA' || e.code === 'PHAI_DOI_PIN') {
        it.trangThai = 'choDN';
        if (e.code !== 'PHAI_DOI_PIN') boToken(it.uid);
        if (it.uid === S.uid) xuLyLoiPhien(e);
        return luu(it).then(tiep);
      }
      it.trangThai = 'loi';
      it.soLan++;
      if (e.code === 'DA_SUA' && e.them && e.them.banMoi && it.dong && it.dong[0] && typeof luuDongMay === 'function') luuDongMay(it.dong[0].bang, e.them.banMoi);
      it.loi = { code: e.code, message: e.message, them: e.them && e.them.banMoi ? { truong: e.them.truong } : e.them };
      return luu(it).then(tiep);
    });
  }
  return tiep().catch(function (e) { console.error(e); }).then(function () {
    S.dangGui = false;
    if (S.goiLaiSau && S.hang.some(function (x) { return x.trangThai === 'cho'; })) setTimeout(guiHangCho, 1000);
    S.goiLaiSau = false;
    veChipCho();
    if (S.manHienTai === 'hangcho') veMan({ giuCuon: true });
    if (coGui) return dongBo();
  });
}

function boViec(opId) {
  var it = S.hang.filter(function (x) { return x.opId === opId; })[0];
  if (!it) return Promise.resolve();
  S.hang.splice(S.hang.indexOf(it), 1);
  if (SAU_BO[it.action]) try { SAU_BO[it.action](it); } catch (e) { console.error(e); }
  return DB.xoa('hang', opId).then(function () {
    var bang = {};
    (it.dong || []).forEach(function (d) { bang[d.bang] = 1; });
    return Promise.all(Object.keys(bang).map(taiBang)); // tải lại từ bộ nhớ máy: bỏ dòng tạm của việc này
  }).then(veChipCho);
}
function guiLaiViec(opId) {
  var it = S.hang.filter(function (x) { return x.opId === opId; })[0];
  if (!it) return Promise.resolve();
  it.trangThai = 'cho';
  it.loi = null;
  return DB.dat('hang', it).then(guiHangCho);
}

/* ---------- 6. Đồng bộ ---------- */
function taiBang(ten) {
  return DB.tatCa(ten).then(function (ds) {
    var m = new Map();
    ds.forEach(function (o) { m.set(o.ID, o); });
    D[ten] = m;
    S.hang.forEach(function (it) { if (it.dong && it.dong.some(function (d) { return d.bang === ten; })) apDungTam(it); });
  }).catch(function () {});
}

/** Áp một trang máy chủ trả về: {cot, dong, day}. day = cả trang (thay hết), còn lại là phần đổi. */
function apDungBang(ten, b) {
  var ds = b.dong.map(function (h) { var o = {}; b.cot.forEach(function (c, i) { o[c] = h[i]; }); return o; });
  if (!D[ten]) return Promise.resolve(0);
  var them = [], bo = [];
  ds.forEach(function (o) { if (Number(o.Xoa) === 1) bo.push(o.ID); else them.push(o); });
  var p = b.day ? DB.xoaHet(ten).then(function () { D[ten] = new Map(); }) : Promise.resolve();
  return p.then(function () { return DB.xoaNhieu(ten, bo); }).then(function () { return DB.datNhieu(ten, them); }).then(function () {
    bo.forEach(function (id) { D[ten].delete(id); });
    them.forEach(function (o) { D[ten].set(o.ID, o); });
    return ds.length + (b.day ? 1 : 0);
  });
}

/** Lấy phần đổi từ máy chủ (toanBo: tải lại hết). Dữ liệu trên máy hiện trước, làm mới ở nền. */
function dongBo(tc) {
  tc = tc || {};
  if (!S.uid || S.dangDongBo) return Promise.resolve();
  if (!tokenCua(S.uid)) return S.pinTam ? layLaiToken().then(function (co) { if (co) return dongBo(tc); }) : Promise.resolve();
  S.dangDongBo = true;
  veChipCho();
  var uid = S.uid;
  return api('layDuLieu', { moc: tc.toanBo ? {} : S.moc, toanBo: !!tc.toanBo }).then(function (d) {
    if (uid !== S.uid) return;
    var doi = 0, ten = Object.keys(d.trang || {});
    var p = Promise.resolve();
    ten.forEach(function (k) {
      p = p.then(function () { return apDungBang(k, d.trang[k]); }).then(function (n) { doi += n; S.moc[k] = d.moc; });
    });
    return p.then(function () {
      S.hang.forEach(apDungTam);
      S.dongBoLuc = Date.now();
      S.caiDat = d.caiDat || S.caiDat;
      S.pbMayChu = d.phienBan || S.pbMayChu;
      var cuCap = S.nd && S.nd.Cap;
      if (d.toi) {
        S.nd = hopNhatNd(d.toi);
        if (S.tokens[uid]) { S.tokens[uid].nd = d.toi; kvDat('tokens', S.tokens); }
      }
      kvDat('moc', S.moc); kvDat('dongBoLuc', S.dongBoLuc); kvDat('caiDat', S.caiDat); kvDat('pbMayChu', S.pbMayChu);
      if (S.nd && cuCap && S.nd.Cap !== cuCap) return chuanBiDuLieuCho(S.nd).then(function () { dungKhung(); veMan(); });
      if (S.nd && Number(S.nd.DoiPin) === 1) return veMan();
      if (doi || tc.toanBo) veMan({ giuCuon: true, lamMoi: true });
      xuLyMoTem();
    });
  }, function (e) {
    if (!e.mang) xuLyLoiPhien(e);
  }).then(function () {
    S.dangDongBo = false;
    veChipCho();
    if (S.manHienTai === 'trangchu' || S.manHienTai === 'toi') veTrangThaiNho();
  });
}

/* ---------- 7. Điều hướng & khung ---------- */
var MAN = {};
/**
 * Khai báo màn. def: { tieuDe: khoá TX, cap: cấp thấp nhất, cha: '#/...', tab: tên ô thanh dưới,
 *   xong: true khi đã làm (chưa làm thì ẩn), ve: function (el, thamSo, tc),
 *   khongLamMoi: đồng bộ xong không vẽ lại, lamMoi: hàm vẽ lại phần danh sách (giữ ô tìm đang gõ) }
 */
function man(ten, def) { def.ten = ten; if (def.cap == null) def.cap = 4; MAN[ten] = def; }
function coQuyen(cap) { return !!S.nd && Number(S.nd.Cap) >= 1 && Number(S.nd.Cap) <= cap; }
function dungDuoc(ten) { var m = MAN[ten]; return !!(m && m.xong && coQuyen(m.cap)); }
function di(duong, thay) {
  var h = '#/' + String(duong || '').replace(/^#?\/?/, '');
  if (thay) { history.replaceState(null, '', h); veMan(); } else if (location.hash === h) veMan(); else location.hash = h;
}
function duongHienTai() {
  var p = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean).map(decodeURIComponent);
  return { ten: p[0] || 'trangchu', ts: p.slice(1) };
}

var TAB = [
  { ten: 'trangchu', ic: 'nha' }, { ten: 'phieu', ic: 'phieu' }, { ten: 'quet', ic: 'quet', giua: true },
  { ten: 'baoduong', ic: 'baoduong' }, { ten: 'dien', ic: 'dien' }, { ten: 'baohong', ic: 'canh', chiCap4: true }
];
var MENU = ['trangchu', 'thietbi', 'baocao', 'quantri', 'hangcho', 'toi'];
var IC_MAN = { trangchu: 'nha', thietbi: 'may', baocao: 'danhMuc', quantri: 'quanTri', hangcho: 'hangCho', toi: 'nguoi' };

function dungKhung() {
  var app = $('#app');
  app.innerHTML =
    '<header class="dau"><div class="dau-trong">' +
    '<div class="dau-trai" id="dau-trai"></div>' +
    '<div class="dau-giua"><div class="dau-vi" id="dau-vi"></div><div class="dau-zh" id="dau-zh" lang="zh-CN"></div></div>' +
    '<div class="dau-phai"><span id="chip-cho"></span>' +
    '<button class="nut-dau" data-act="moMenu" aria-label="' + tp('menu') + '">' + ic('menu') + '</button></div>' +
    '</div></header>' +
    '<div class="bang-tin" id="bang-tin"></div>' +
    '<main class="noi-dung" id="noi-dung"></main>' +
    '<nav class="thanh-duoi" id="thanh-duoi" hidden></nav>';
  veThanhDuoi();
  veBangTin();
  veChipCho();
}

function veThanhDuoi() {
  var nav = $('#thanh-duoi');
  if (!nav) return;
  var cap4 = S.nd && Number(S.nd.Cap) === 4;
  var ds = TAB.filter(function (x) {
    if (x.chiCap4 && !cap4) return false;
    if (cap4 && ['phieu', 'baoduong', 'dien'].indexOf(x.ten) >= 0) return false;
    return dungDuoc(x.ten);
  });
  var hien = ds.length >= 2;
  nav.hidden = !hien;
  document.body.classList.toggle('co-thanh-duoi', hien);
  var dang = MAN[S.manHienTai] ? (MAN[S.manHienTai].tab || S.manHienTai) : '';
  nav.innerHTML = ds.map(function (x) {
    var nhan = TX['man.' + x.ten] || ['', ''];
    return '<a class="tab' + (x.giua ? ' tab-giua' : '') + (dang === x.ten ? ' dang' : '') + '" href="#/' + x.ten + '">' +
      (x.giua ? '<span class="tab-tron">' + ic(x.ic) + '</span>' : ic(x.ic)) +
      '<span>' + esc(nhan[0]) + '<span class="zh" lang="zh-CN">' + esc(nhan[1]) + '</span></span></a>';
  }).join('');
}

function veBangTin() {
  var el = $('#bang-tin');
  if (!el) return;
  var h = '';
  if (!S.coMang) h += '<div class="tin-mang">' + ic('matMang', 'ic-nho') + '<span class="inline">' + t('matMangGhi') + '</span></div>';
  if (S.coBanMoi) h += '<div class="tin-ban-moi">' + ic('lamMoi', 'ic-nho') + '<span class="inline">' + t('coBanMoi') + '</span><button data-act="capNhatBan">' + tp('capNhat') + '</button></div>';
  el.innerHTML = h;
  requestAnimationFrame(function () {
    document.documentElement.style.setProperty('--bu-tin', el.offsetHeight + 'px');
  });
}

function veChipCho() {
  var el = $('#chip-cho');
  if (!el) return;
  var n = soViecCho(), l = soViecLoi();
  if (!n && !l) {
    el.innerHTML = S.dangDongBo ? '<span class="nut-dau xoay" aria-label="' + tp('dangCapNhat') + '">' + ic('lamMoi', 'ic-nho') + '</span>' : '';
    return;
  }
  el.innerHTML = '<a class="chip-cho' + (l ? ' loi' : '') + (S.dangGui ? ' xoay' : '') + '" href="#/hangcho" aria-label="' + tp('man.hangcho') + '">' +
    ic(l ? 'canh' : 'hangCho') + '<span class="so">' + (n + l) + '</span></a>';
}

/** Vẽ màn theo đường dẫn hiện tại. tc.giuCuon: giữ vị trí cuộn (khi làm mới dữ liệu). */
function veMan(tc) {
  tc = tc || {};
  if (!S.nd) return veDangNhap();
  if (!$('#noi-dung')) dungKhung();
  var dd = duongHienTai(), ten = dd.ten;
  if (Number(S.nd.DoiPin) === 1 && ten !== 'doipin') { history.replaceState(null, '', '#/doipin'); ten = 'doipin'; dd.ts = []; }
  var def = MAN[ten];
  if (!def || !def.xong || !coQuyen(def.cap)) { history.replaceState(null, '', '#/'); ten = 'trangchu'; def = MAN.trangchu; dd.ts = []; }
  if (tc.lamMoi && def.khongLamMoi) return;
  var doiMan = S.manHienTai !== ten || S.thamSo !== dd.ts.join('/');
  if (tc.lamMoi && def.lamMoi && !doiMan) { try { def.lamMoi(); } catch (e) { console.error(e); } return; }  // làm mới phần danh sách, giữ ô đang gõ
  if (doiMan) roiMan();
  S.manHienTai = ten;
  S.thamSo = dd.ts.join('/');
  var tieuDe = TX[def.tieuDe || ('man.' + ten)] || [ten, ''];
  $('#dau-vi').textContent = tieuDe[0];
  $('#dau-zh').textContent = tieuDe[1];
  $('#dau-trai').innerHTML = def.cha && !(ten === 'doipin' && Number(S.nd.DoiPin) === 1)
    ? '<a class="nut-dau" href="' + def.cha + '" aria-label="' + tp('quayLai') + '">' + ic('lui') + '</a>'
    : '<span class="logo-nho">' + logoSvg() + '</span>';
  document.title = tieuDe[0] + ' · Cơ Điện';
  veThanhDuoi();
  var el = $('#noi-dung');
  var cuon = tc.giuCuon && !doiMan ? window.scrollY : 0;
  var luot = ++S.luotVe;
  var kq;
  try { kq = def.ve(el, dd.ts, { luot: luot }); } catch (e) { console.error(e); el.innerHTML = '<div class="the">' + loiChu(e) + '</div>'; }
  Promise.resolve(kq).then(function () { if (luot === S.luotVe) window.scrollTo(0, cuon); });
}
function conLuot(tc) { return !tc || tc.luot === S.luotVe; }
/** Màn đang mở đặt S.roiMan = hàm dọn (tắt camera...); chạy khi rời màn hoặc thoát phiên. */
function roiMan() {
  var f = S.roiMan;
  S.roiMan = null;
  if (f) try { f(); } catch (e) { console.error(e); }
}

window.addEventListener('hashchange', function () { dongLopPhu(); veMan(); });

/* Bấm nút: data-act="tênHàm" → HANH[tênHàm](phầnTử, sựKiện) */
var HANH = {};
document.addEventListener('click', function (e) {

});

HANH.moMenu = moMenu;

};

  requestAnimationFrame(function () { $('.man-che', el).classList.add('hien'); $('.menu', el).classList.add('hien'); });
}

/* ---------- 8. Lớp phủ: hộp thoại, trang trượt, thông báo ---------- */
function moLopPhu(html) {
  var el = document.createElement('div');
  el.className = 'lop';
  el.innerHTML = html;
  $('#lop-phu').appendChild(el);
  return el;
}
function dongLopPhu() { $('#lop-phu').innerHTML = ''; }
HANH.dongLopPhu = dongLopPhu;

/** Thông báo ngắn. kieu: 'tot' | 'loi' | ''. */
function bao(html, kieu, ms) {
  var el = document.createElement('div');
  el.className = 'bao ' + (kieu || '');
  el.innerHTML = (kieu === 'loi' ? ic('canh', 'ic-nho') : kieu === 'tot' ? ic('dung', 'ic-nho') : '') + '<div>' + html + '</div>';
  var hop = $('#thong-bao');
  hop.appendChild(el);
  while (hop.children.length > 3) hop.removeChild(hop.firstChild);
  setTimeout(function () { el.remove(); }, ms || (kieu === 'loi' ? 5000 : 2800));
  el.addEventListener('click', function () { el.remove(); });

/**
 * Trang trượt lên cho biểu mẫu. tc: { tieuDe: [vi, zh] hoặc khoá, html, luu: async (el) → true để đóng, nhanLuu }.
 */
function moTrang(tc) {
  var td = Array.isArray(tc.tieuDe) ? tc.tieuDe : (TX[tc.tieuDe] || [tc.tieuDe, '']);
  var el = moLopPhu('<section class="trang-truot" role="dialog" aria-modal="true">' +
    '<div class="tt-dau"><button class="nut-chu" data-k="huy" style="justify-self:start">' + t(tc.nhanHuy || 'huy') + '</button>' +
    '<div class="dau-giua"><div class="dau-vi">' + esc(td[0]) + '</div><div class="dau-zh" lang="zh-CN" style="opacity:.7">' + esc(td[1]) + '</div></div>' +
    (tc.luu ? '<button class="nut-chu dam" data-k="luu" style="justify-self:end">' + t(tc.nhanLuu || 'luu') + '</button>' : '<span></span>') +
    '</div><form class="tt-than" novalidate>' + tc.html + '<button type="submit" hidden></button></form></section>');
  var trang = $('.trang-truot', el), form = $('form', el);
  requestAnimationFrame(function () { trang.classList.add('hien'); });
  function dong() { trang.classList.remove('hien'); setTimeout(function () { el.remove(); }, 250); }
  $('[data-k="huy"]', el).addEventListener('click', dong);
  var nutLuu = $('[data-k="luu"]', el);
  function luu(e) {
    if (e) e.preventDefault();
    if (!tc.luu || nutLuu.disabled) return;
    nutLuu.disabled = true;
    var cu = nutLuu.innerHTML;
    nutLuu.innerHTML = '<span class="quay"></span>';
    Promise.resolve().then(function () { return tc.luu(form); }).then(function (xong) {
      nutLuu.disabled = false; nutLuu.innerHTML = cu;
      if (xong) dong();
    }, function (x) {
      nutLuu.disabled = false; nutLuu.innerHTML = cu;
      baoLoi(x);
    });
  }
  if (nutLuu) nutLuu.addEventListener('click', luu);
  form.addEventListener('submit', luu);
  if (tc.moXong) tc.moXong(form, dong);
  return { el: el, form: form, dong: dong };
}

/**
 * Bàn phím PIN 6 số. tc: { hoi: html câu hỏi, buoc: [i, n], xong: function(pin, ctl) }.
 * ctl: { xoa(), baoLoi(html), dang(html) }.
 */
function banPhimPin(el, tc) {
  var pin = '', khoa = false;
  el.innerHTML =
    (tc.buoc ? '<div class="buoc" aria-hidden="true">' + Array.from({ length: tc.buoc[1] }, function (_, i) { return '<i' + (i < tc.buoc[0] ? ' class="co"' : '') + '></i>'; }).join('') + '</div>' : '') +
    '<div class="pin-hoi">' + tc.hoi + '</div>' +
    '<div class="pin-cham" role="img" aria-label="PIN">' + '<i></i><i></i><i></i><i></i><i></i><i></i></div>' +
    '<div class="pin-bao" aria-live="assertive">' + (tc.bao || '') + '</div>' +
    '<div class="ban-phim">' +
    [1, 2, 3, 4, 5, 6, 7, 8, 9].map(function (n) { return '<button type="button" class="phim" data-so="' + n + '">' + n + '</button>'; }).join('') +
    (tc.nutTrai || '<span></span>') +
    '<button type="button" class="phim" data-so="0">0</button>' +
    '<button type="button" class="phim phu" data-xoa="1" aria-label="' + tp('xoaSo') + '">' + ic('xoaSo') + '</button></div>';
  var cham = $$('.pin-cham i', el), khungBao = $('.pin-bao', el);
  function ve() { cham.forEach(function (c, i) { c.classList.toggle('co', i < pin.length); }); }
  var ctl = {
    xoa: function () { pin = ''; khoa = false; ve(); },
    baoLoi: function (html) {
      khoa = false; pin = ''; ve();
      khungBao.className = 'pin-bao'; khungBao.innerHTML = html;
      var c = $('.pin-cham', el); c.classList.remove('rung'); void c.offsetWidth; c.classList.add('rung');
      if (navigator.vibrate) try { navigator.vibrate(120); } catch (e) {}
    },
    dang: function (html) { khungBao.className = 'pin-bao dang'; khungBao.innerHTML = '<span class="quay" style="width:16px;height:16px;border-width:2px;vertical-align:-3px"></span> ' + html; },
    baoThuong: function (html) { khungBao.className = 'pin-bao dang'; khungBao.innerHTML = html; }
  };
  function bam(n) {
    if (khoa) return;
    if (n === 'x') pin = pin.slice(0, -1);
    else if (pin.length < 6) pin += n;
    ve();
    if (pin.length === 6) { khoa = true; var p = pin; setTimeout(function () { tc.xong(p, ctl); }, 120); }
  }
  el.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    if (b.hasAttribute('data-so')) bam(b.getAttribute('data-so'));
    else if (b.hasAttribute('data-xoa')) bam('x');
  });
  el._phim = function (e) {
    if (/^\d$/.test(e.key)) bam(e.key);
    else if (e.key === 'Backspace') bam('x');
  };
  return ctl;
}
var _nghePhim = null;
function ngheBanPhim(el) {
  if (_nghePhim) document.removeEventListener('keydown', _nghePhim);
  _nghePhim = function (e) { if (document.body.contains(el) && el._phim && !$('#lop-phu').children.length) el._phim(e); };

function phanTichTem(s) {
  s = String(s || '').trim();

      [APP_URL, location.href].forEach(function (g) {

/** Đọc mã QR từ video (vùng giữa) hoặc ảnh (cả ảnh, thử cả màu đảo). */
function docMaQR(src, w, h, laAnh) {

      var r = jsQR(g.getImageData(0, 0, cv.width, cv.height).data, cv.width, cv.height, { inversionAttempts: laAnh ? 'attemptBoth' : 'dontInvert' });
      return r ? r.data : null;

  });
}

        if (!isFinite(n) || n < 0 || Math.floor(n) !== n) { bao(t('dm.thuTuSai'), 'loi'); return false; }
        p.ThuTu = n;
      }
      if (moi) { var ma = gtO(f, 'Ma').toUpperCase(); if (ma) p.Ma = ma; }
      else { p.ID = o.ID; p.HoatDong = gtO(f, 'HoatDong'); p.CapNhat = o.CapNhat; }
      if (p.Ma && !/^[A-Z0-9_-]{1,20}$/.test(p.Ma)) { bao(t('dm.maSai'), 'loi'); return false; }
      var tuDich = !p.TenVi || !p.TenZh;
      return goiThang('luuDanhMuc', p, { ghi: true }).then(function (d) {
        return luuDongMay('DanhMuc', d && d.danhMuc).then(function () {
          veDsDm();
          var x = d && d.danhMuc;
          if (tuDich && x && x.TenVi && x.TenZh) bao(t('daLuu') + '<br>' + t('dm.daDich', { vi: x.TenVi, zh: x.TenZh }), 'tot', 4500);
          else if (tuDich) bao(t('dm.chuaDich'), 'loi');
          else bao(t('daLuu'), 'tot');
          return true;
        });
      }, function (e) { xuLyDaSua('DanhMuc', e); throw e; });
    },
    moXong: function (f, dong) {
      var b = $('[data-k="xoa"]', f);
      if (b) b.addEventListener('click', function () {
        hoi({ tieuDe: 'dm.xoaHoi', noiDung: t('dm.xoaGhi', { ten: o.TenVi || o.TenZh }), dongY: 'dm.xoa', nguy: true }).then(function (co) {
          if (!co || !coMangHoacBao()) return;
          goiThang('luuDanhMuc', { ID: o.ID, xoa: true, CapNhat: o.CapNhat }, { ghi: true }).then(function (d) {
            return luuDongMay('DanhMuc', d && d.danhMuc);
          }).then(function () { dong(); veDsDm(); bao(t('daXoa'), 'tot'); }, function (e) { xuLyDaSua('DanhMuc', e); baoLoi(e); });
        });
      });
    }
  });
}

/* demo.js — nút "Xem thử · 演示" chỉ có trong bản xem thử: PIN mẫu, giả lập mất mạng. */
(function () {
  if (!DEMO) return;
  function veNut() {
    var b = document.getElementById('demo-nut');
    if (!b) {
      b = document.createElement('button');
      b.id = 'demo-nut';
      b.className = 'demo-nut';
      b.addEventListener('click', moBang);
      document.body.appendChild(b);
    }
    b.classList.toggle('mat-mang', S.demoMatMang);
    b.innerHTML = (S.demoMatMang ? ic('matMang', 'ic-nho') : ic('thongTin', 'ic-nho')) + '<span class="inline">' + t(S.demoMatMang ? 'demo.matMang' : 'demo.nut') + '</span>';
  }
  function dienPin(pin) {
    function go() {
      var el = document.getElementById('pin-giua');
      if (!el || !el._phim) return;
      pin.split('').forEach(function (k, i) { setTimeout(function () { el._phim({ key: k }); }, 90 * i); });
    }
    if (S.uid) thoatPhien('').then(function () { setTimeout(go, 50); }); else go();
  }
  function moBang() {
    var cu = document.getElementById('demo-bang');
    if (cu) { cu.remove(); return; }
    var el = document.createElement('div');
    el.id = 'demo-bang';
    el.className = 'demo-bang';
    el.innerHTML = '<h3>' + t('demo.tieuDe') + '</h3><div class="dong-phu">' + t('demo.ghi') + '</div>' +
      '<label class="bat" for="demo-mm"><span class="dong-chinh">' + t('demo.matMang') + '</span><input type="checkbox" id="demo-mm"' + (S.demoMatMang ? ' checked' : '') + '></label>' +
      '<div class="o-nhan">' + t('demo.pin') + '</div><div class="demo-pin">' +
      (window.DEMO_PIN || []).map(function (x) { return '<button data-pin="' + x[0] + '"><span>' + esc(x[1]) + ' <span class="zh" lang="zh-CN">' + esc(x[2]) + ' · ' + tp('cap.' + x[3]) + '</span></span><b>' + x[0] + '</b></button>'; }).join('') +
      '</div>';
    document.body.appendChild(el);
    el.querySelector('#demo-mm').addEventListener('change', function (e) {
      S.demoMatMang = e.target.checked;
      el.remove();
      datMang(!S.demoMatMang);
      if (S.manHienTai === 'dangnhap') veDangNhap();
      veNut();
    });
    [].forEach.call(el.querySelectorAll('[data-pin]'), function (b) {
      b.addEventListener('click', function () { el.remove(); dienPin(b.getAttribute('data-pin')); });
    });
  }
  document.addEventListener('DOMContentLoaded', function () { setTimeout(veNut, 0); });
  window.__demoVeNut = veNut;
})();
